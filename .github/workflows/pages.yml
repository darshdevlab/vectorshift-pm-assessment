name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch assessment site
        run: |
          set -euo pipefail
          mkdir -p _site
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent --execute robots=off --directory-prefix=/tmp/vectorshift-source https://darsh-vectorshift-pm.darsh2210.chatgpt.site/
          cp -R /tmp/vectorshift-source/darsh-vectorshift-pm.darsh2210.chatgpt.site/. _site/
          find _site -type f -name '*.html' -print0 | xargs -0 sed -i 's#https://darsh-vectorshift-pm.darsh2210.chatgpt.site##g'
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i 's#\.\./BuilderView/#./BuilderView/#g'
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
