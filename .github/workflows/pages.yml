name: Publish assessment site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch assessment site
        run: |
          set -euo pipefail
          mkdir -p _site
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent --execute robots=off --directory-prefix=/tmp/vectorshift-source https://darsh-vectorshift-pm.darsh2210.chatgpt.site/
          cp -R /tmp/vectorshift-source/darsh-vectorshift-pm.darsh2210.chatgpt.site/. _site/
          find _site -type f -name '*.html' -print0 | xargs -0 sed -i 's#https://darsh-vectorshift-pm.darsh2210.chatgpt.site##g'
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i 's#\.\./BuilderView/#./BuilderView/#g'
          touch _site/.nojekyll
      - name: Publish files to gh-pages branch
        run: |
          set -euo pipefail
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish assessment site"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
